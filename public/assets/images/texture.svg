<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1400"
  height="2000"
  viewBox="0 0 1400 2000"
>
  <defs>
    <filter id="cloud">
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".003 .006"
        numOctaves="4"
        seed="9"
      />
      <feColorMatrix values=".24 0 0 0 .04 0 .13 0 0 .02 0 0 .35 0 .08 0 0 0 .4 0" />
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>
  <rect width="1400" height="2000" fill="#2f131a" />
  <rect width="1400" height="2000" filter="url(#cloud)" opacity=".65" />
</svg>
